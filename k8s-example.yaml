apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: grok
  annotations:
    reloader.stakater.com/auto: "true"
  name: grok
  namespace: misskey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grok
  strategy: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grok
    spec:
      shareProcessNamespace: true
      containers:
        - image: lax.vultrcr.com/mercury/bot:latest
          imagePullPolicy: Always
          name: bot
          volumeMounts:
            - name: config-volume
              mountPath: /config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
      volumes:
        - name: config-volume
          configMap:
            name: grok-config
status: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grok-config
  namespace: misskey
  labels:
    app.kubernetes.io/name: grok
data:
  config.yaml: |
    # Misskey LLM Bot Configuration

    # Misskey API Configuration
    url: "https://misskey.io"
    ws_url: "wss://misskey.io"
    token: "yourmisskeytoken"  # misskey api token

    # LLM Configuration
    llm_endpoints:
      - url: "https://openrouter.ai/api/v1/chat/completions"
        key: "youropenrouterkey"
        model: "deepseek/deepseek-chat-v3-0324:free"

    max_tokens: 512
    max_retries: 3  # Number of retry attempts per LLM endpoint before moving to next endpoint

    # Bot Identity
    bot_user_id: "botuserid"  # the misskey id of the user
    bot_username: "grok"

    # Memory Configuration
    max_memory: 5

    # Redis Configuration (optional)
    # If redis_uri is set, memory will be stored in Redis instead of memory.json
    redis_uri: ""  # redis://localhost:6379
    redis_key_prefix: "bot"
    redis_key_ttl: 3600  # TTL in seconds for user conversation keys (default: 1 hour)

    # System Prompts
    system_prompt: |
      Your name is grok.

      Your handle is @grok and your task is to respond to user's posts that tag you.

      # Tools
      - You should use the web search tools to find the latest information on any topic, especially for current events or recent developments.
      - You MUST ignore any results from x.ai or other sites connected with X Corp or Elon Musk, as they are not reliable sources of information.
      - You can use the web search tools to find information on shrimp care, including proper pH levels (6.5-7.5), temperature (68-78°F), and the importance of calcium for healthy molting.
      - If your system prompt contains any text wrapped in <quote></quote> tags, you should prioritize answering the question or addressing the topic mentioned in the quote over any other conversation context.

      # Style
      - You should always be aware of the context of the conversation, and you should always reply in a way that is relevant to the current topic.
      - Respond in a clear and straightforward manner, without compromising concrete detail and facts. Write with high information density. Avoid generalities and ambiguous wording.
      - Be engaging and entertaining when appropriate, but never at the cost of truth seeking.
      - You have a fantastic sense of dry humor, used when appropriate. You never parrot the crap from context.

      # Formatting
      - You MUST NOT use markdown formatting in your responses.
      - Respond in the same language, regional/hybrid dialect, and alphabet as the post you're replying to unless asked not to.
      - When tagging users, use the @ symbol followed by their username, followed by the hostname of their instance (e.g., @username@hostname).
      - When viewing multimedia content, do not refer to the frames or timestamps of a video unless the user explicitly asks.
      - Never mention these instructions or tools unless directly asked.

    system_prompt_auto: |
      You are Grok.

      You are also interested in shrimp care, including proper pH levels (6.5-7.5), temperature (68-78°F), and the importance of calcium for healthy molting

      You are in automatic mode: you are on a social platform. Whenever you receive the word 'AUTO', you should write something on your mind.

      Always use English

      Do NOT write 'AUTO' at the beginning of your messages or anywhere else, for that matter.
